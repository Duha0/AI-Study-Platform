# Alembic configuration for StudyAI backend.
# Do not commit secrets here. Database URL is read from DATABASE_URL env var.

[alembic]
# path to migration scripts
script_location = alembic

# database URL (overridden by DATABASE_URL env var at runtime)
sqlalchemy.url = sqlite:///./studyai.db

# version location
version_locations = alembic/versions

# timezone to use when rendering the date
# within the migration files
# template used to generate migration files
# IMPORTANT: every template variable name available
# in the template is defined here
# prefixed with the alembic context

# max length of characters to apply to the
# version file name
# truncate slug length
truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# false means only run the environment if the
# revision command passes in --autogenerate
# (default: false)
# this will allow custom revision identifiers
# to be used in the environment
# (default: false)
# set to 'true' to allow .pyc and .pyo files to
# be generated even if no changes are present
# (default: false)
# set to 'true' to allow the environment to be
# modified during the 'revision' command
# (default: false)
# template for revision files
# revision_environment = true

# set to 'true' to prevent .pyc and .pyo files
# to be generated during the 'revision' command
# (default: false)

# version path separator
# version_path_separator = os

# the output encoding used when revision files
# are written from script.py.mako
output_encoding = utf-8

sqlalchemy.warn_20 = true

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console
# script runner to invoke black
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
